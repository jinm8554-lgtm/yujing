<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>余烬纪元</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a1418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="style.css">
  <style>
    html { overflow: hidden; }
    body { position: fixed; inset: 0; overflow: hidden; background: #171511; }
    #GameDiv { position: relative; overflow: hidden; }
    #ember-boot { position:fixed; inset:0; z-index:1000; display:grid; place-items:center; color:#f0e0bd; background:#171511; font-family:SimSun,'Songti SC',serif; }
    #ember-boot[hidden] { display:none; }
    .boot-viewport { position:relative; width:100%; height:100%; overflow:hidden; display:grid; place-items:center; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing:border-box; }
    .boot-viewport::before { content:''; position:absolute; inset:0; opacity:.28; background-image:var(--ember-tavern); background-position:center; background-size:cover; }
    .boot-viewport::after { content:''; position:absolute; inset:0; background:linear-gradient(#171511ed,transparent 45%,#171511ed); }
    .boot-card { position:relative; z-index:1; display:flex; flex-direction:column; width:calc(100% - 40px); max-width:324px; text-align:center; }
    .boot-card > * { flex-shrink:0; }
    .boot-eyebrow { height:20px; line-height:20px; color:#b6a88b; font-size:12px; letter-spacing:.16em; margin:0 0 16px; }
    .boot-emblem { width:70px; height:70px; box-sizing:border-box; margin:auto; border:1px solid #796440; border-radius:50%; display:grid; place-items:center; outline:1px solid #796440; outline-offset:-7px; }
    .boot-compass { color:#d1ad72; font-size:54px; line-height:1; animation:boot-sway 5s ease-in-out infinite; }
    .boot-title { height:44px; line-height:44px; font-size:32px; font-weight:normal; margin:16px 0 0; }
    .boot-subtitle { height:24px; line-height:24px; font-size:14px; color:#b6a88b; margin:0; }
    .boot-rule { height:10px; display:flex; align-items:center; gap:12px; color:#c9a369; font-size:10px; margin:12px 10%; }
    .boot-rule::before,.boot-rule::after { content:''; height:1px; background:#695438; flex:1; }
    .boot-steps { height:66px; display:flex; justify-content:space-around; margin:0 0 12px; font-size:13px; color:#b6a88b; }
    .boot-steps figure { margin:0; }
    .boot-steps img { display:block; width:42px; height:42px; box-sizing:border-box; object-fit:contain; background:#2b251c; padding:8px; border:1px solid #88704a; border-radius:50%; margin:0 auto 2px; }
    .boot-steps figcaption { height:22px; line-height:22px; }
    .boot-stage { height:26px; line-height:26px; text-align:left; font-size:16px; margin:0 0 8px; }
    .boot-track { height:12px; padding:3px; box-sizing:border-box; border:1px solid #8a6b41; background:#100f0d; border-radius:4px; overflow:hidden; }
    .boot-shimmer { height:100%; width:28%; background:#c9a369; border-radius:2px; animation:boot-wait 2s ease-in-out infinite alternate; }
    .boot-detail { height:36px; display:grid; place-items:center; color:#b6a88b; font-size:12px; line-height:18px; margin:8px 0 12px; }
    .boot-tip { height:96px; box-sizing:border-box; padding:12px; text-align:left; font-size:14px; line-height:21px; border:1px solid #605038; background:#242018e8; border-radius:4px; }
    .boot-tip strong { height:22px; line-height:22px; color:#c9a369; display:block; font-weight:normal; margin:0 0 4px; }
    #ember-boot-retry { display:block; height:48px; width:70%; box-sizing:border-box; margin:16px auto 0; background:#79512f; border:1px solid #cca96b; color:#f0e0bd; border-radius:4px; font:16px SimSun,serif; }
    #ember-boot-retry[hidden] { display:none; }
    @keyframes boot-sway { 50% { transform:rotate(8deg); } }
    @keyframes boot-wait { to { transform:translateX(250%); } }
    /* Match LoginScreen's 720x1280 SHOW_ALL policy on wide viewports, before JS is ready. */
    @media (min-aspect-ratio:4/5) { .boot-viewport { width:56.25vh; } }
    #ember-boot[data-density=compact] .boot-eyebrow { height:18px;line-height:18px;margin-bottom:8px; }
    #ember-boot[data-density=compact] .boot-emblem { width:54px;height:54px; }
    #ember-boot[data-density=compact] .boot-compass {font-size:42px;}
    #ember-boot[data-density=compact] .boot-title {height:40px;line-height:40px;margin-top:8px;font-size:30px;}
    #ember-boot[data-density=compact] .boot-subtitle {height:22px;line-height:22px;}
    #ember-boot[data-density=compact] .boot-rule {height:8px;margin:6px 10% 8px;}
    #ember-boot[data-density=compact] .boot-steps {height:60px;margin-bottom:8px;}
    #ember-boot[data-density=compact] .boot-stage {margin-bottom:6px;}
    #ember-boot[data-density=compact] .boot-detail {margin:6px 0 8px;}
    #ember-boot[data-density=compact] .boot-tip {height:88px;padding:8px 12px;}
    #ember-boot[data-density=short] .boot-eyebrow,#ember-boot[data-density=short] .boot-subtitle,#ember-boot[data-density=short] .boot-rule,#ember-boot[data-density=short] .boot-steps {display:none;}
    #ember-boot[data-density=short] .boot-emblem {width:40px;height:40px;}
    #ember-boot[data-density=short] .boot-compass {font-size:30px;}
    #ember-boot[data-density=short] .boot-title {height:38px;line-height:38px;font-size:28px;margin:8px 0 10px;}
    #ember-boot[data-density=short] .boot-stage {margin-bottom:6px;}
    #ember-boot[data-density=short] .boot-detail {height:38px;margin:6px 0 8px;}
    #ember-boot[data-density=short] .boot-tip {height:108px;padding:8px 12px;}
    #ember-boot[data-density=short] #ember-boot-retry {margin-top:12px;}
    #ember-boot[data-hide-tip=true] .boot-tip {display:none;}
    @media (prefers-reduced-motion:reduce) { .boot-compass,.boot-shimmer {animation:none;} }
    #ember-boot[data-reduced-motion=true] .boot-compass,#ember-boot[data-reduced-motion=true] .boot-shimmer {animation:none;}

        <figure><img data-boot-icon="satchel" alt=""><figcaption>行囊</figcaption></figure>
        <figure><img data-boot-icon="party" alt=""><figcaption>同伴</figcaption></figure>
        <figure><img data-boot-icon="sword" alt=""><figcaption>冒险</figcaption></figure>
      </div>
      <p class="boot-stage" id="ember-boot-stage">正在唤醒余烬</p>
      <div class="boot-track" aria-label="游戏正在启动"><div class="boot-shimmer"></div></div>
      <p class="boot-detail" id="ember-boot-detail">正在准备旅途，请稍候…</p>
      <div class="boot-tip"><strong>行前准备</strong>学会技能后，记得在角色页装备主动与被动技能。</div>
      <button id="ember-boot-retry" type="button" hidden>重新载入</button>
    </div>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('ember-boot'), timer;
      // Use the same safe-area/CSS-pixel layout as LoadingView, without scaling text or buttons.
      function layout() {
        var pane=root.querySelector('.boot-viewport'), style=getComputedStyle(pane);
        var available=pane.clientHeight-parseFloat(style.paddingTop||0)-parseFloat(style.paddingBottom||0);
        root.dataset.density=available<420?'short':available<600?'compact':'normal';
        root.dataset.hideTip='false';
        root.dataset.hideTip=String(root.querySelector('.boot-card').offsetHeight>available-24);
      }
      window.addEventListener('resize',layout); layout();
      try { root.dataset.reducedMotion = localStorage.getItem('ember-era.reduce-motion') === 'true'; } catch (_) {}
      function fail() {
        if (root.hidden) return;
        root.setAttribute('aria-busy','false');
        document.getElementById('ember-boot-stage').textContent = '旅途暂时受阻';
        document.getElementById('ember-boot-detail').textContent = '游戏启动未能完成，请检查连接后重新载入。';
        document.getElementById('ember-boot-retry').hidden = false;
        layout();
      }
      window.__emberBoot = { dismiss:function () { clearTimeout(timer); window.removeEventListener('resize',layout); root.hidden=true; root.setAttribute('aria-busy','false'); }, fail:fail };
      document.getElementById('ember-boot-retry').onclick = function () { this.disabled=true; location.reload(); };
      window.addEventListener('error', function(e) { if(e.target && e.target.tagName==='SCRIPT') fail(); }, true);
      timer=setTimeout(function () {
        if(root.hidden) return;
        document.getElementById('ember-boot-detail').textContent='准备时间较长，请检查连接，或尝试重新载入。';
        document.getElementById('ember-boot-retry').hidden=false;
        layout();
      },45000);
    })();
  </script>
  <div id="GameDiv" cc_exact_fit_screen="true">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" aria-label="余烬纪元游戏画面" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    </div>
  </div>
  <script src="src/polyfills.bundle.js" charset="utf-8"></script>
  <script src="src/system.bundle.js" charset="utf-8"></script>
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
  <script>if(window.System) System.import('./index.js').catch(function (error) { window.__emberBoot.fail(); console.error(error); }); else window.__emberBoot.fail();</script>
</body>
